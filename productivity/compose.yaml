name: productivity

# ============================================================
# BLOQUES REUTILIZABLES
# ============================================================
x-common-env: &common-env
  TZ: ${TZ}

x-common-labels: &common-labels
  autoheal: "true"
  diun.enable: "true"

x-http-healthcheck: &http-healthcheck
  interval: 1m30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # IT-Tools
  # ------------------------------------------------------------
  # Utilidades web para operaciones tecnicas frecuentes.
  # ============================================================
  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped

    environment:
      <<: *common-env

    ports:
      - "${ITTOOLS_PORT}:80"

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging

  # ============================================================
  # Mealie
  # ------------------------------------------------------------
  # Gestor de recetas y planificacion de comidas.
  # ============================================================
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped

    environment:
      <<: *common-env
      ALLOW_SIGNUP: "false"
      BASE_URL: "http://${HOSTNAME}:${MEALIE_PORT}"

    volumes:
      - ./data/mealie:/app/data

    ports:
      - "${MEALIE_PORT}:9000"

    labels:
      <<: *common-labels

    healthcheck:
      <<: *http-healthcheck
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/ || exit 1"]

    logging:
      <<: *default-logging
