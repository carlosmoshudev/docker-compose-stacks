name: pro_finance

x-common-env: &common-env
  TZ: ${TZ}

x-common-labels: &common-labels
  autoheal: "true"
  diun.enable: "true"

x-diun-labels: &diun-labels
  diun.enable: "true"

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    restart: unless-stopped

    depends_on:
      firefly-db:
        condition: service_healthy

    environment:
      <<: *common-env
      APP_ENV: production
      APP_DEBUG: "false"
      SITE_OWNER: ${FIREFLY_SITE_OWNER}
      APP_KEY: ${FIREFLY_APP_KEY}
      DEFAULT_LANGUAGE: es_ES
      DEFAULT_LOCALE: es_ES
      APP_URL: ${FIREFLY_APP_URL}
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: 3306
      DB_DATABASE: ${FIREFLY_DB_NAME}
      DB_USERNAME: ${FIREFLY_DB_USER}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
      STATIC_CRON_TOKEN: ${FIREFLY_STATIC_CRON_TOKEN}
      LOG_CHANNEL: stdout
      APP_LOG_LEVEL: notice

    volumes:
      - ${APPDATA_DIR}/firefly/upload:/var/www/html/storage/upload

    ports:
      - "${FIREFLY_HOST_PORT}:${FIREFLY_CONTAINER_PORT}"

    labels:
      <<: *common-labels

    healthcheck:
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 2m
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]

    logging:
      <<: *default-logging

    networks:
      - finance-net

  firefly-cron:
    image: alpine:3.20
    container_name: firefly-cron
    restart: unless-stopped

    depends_on:
      firefly:
        condition: service_healthy

    environment:
      <<: *common-env
      STATIC_CRON_TOKEN: ${FIREFLY_STATIC_CRON_TOKEN}

    command:
      [
        "sh",
        "-c",
        "apk add --no-cache tzdata wget && (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && echo \"0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\" | crontab - && crond -f -L /dev/stdout"
      ]

    labels:
      <<: *diun-labels

    logging:
      <<: *default-logging

    networks:
      - finance-net

  firefly-db:
    image: mariadb:11.4
    container_name: firefly-db
    restart: unless-stopped

    environment:
      <<: *common-env
      MYSQL_DATABASE: ${FIREFLY_DB_NAME}
      MYSQL_USER: ${FIREFLY_DB_USER}
      MYSQL_PASSWORD: ${FIREFLY_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FIREFLY_DB_ROOT_PASSWORD}

    volumes:
      - ${APPDATA_DIR}/mariadb:/var/lib/mysql

    labels:
      <<: *common-labels

    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent || exit 1"]

    logging:
      <<: *default-logging

    networks:
      - finance-net

networks:
  finance-net:
    name: finance-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.21.0/24

