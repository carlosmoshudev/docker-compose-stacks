# ============================================================
# STACK: Library [PRODUCCION]      compose.yaml
# ------------------------------------------------------------
# - Audiobookshelf: https://www.audiobookshelf.org/
# - Calibre-Web:    https://github.com/janeczku/calibre-web
# - Kavita:         https://www.kavitareader.com/
# - RomM:           https://romm.app/
# - MariaDB:        https://mariadb.org/
# ------------------------------------------------------------
#   Desarrollado y mantenido por Carlos Moshu
#   Stack de cali-home, servidor domestico de Carlos y Lilia
# ============================================================

name: library

# ============================================================
# BLOQUES REUTILIZABLES
# ============================================================
x-common-env: &common-env
  TZ: ${TZ}

x-linuxserver-env: &linuxserver-env
  PUID: "1000"
  PGID: "1000"
  TZ: ${TZ}

x-common-labels: &common-labels
  autoheal: "true"
  diun.enable: "true"

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # Audiobookshelf
  # ------------------------------------------------------------
  # Biblioteca de audiolibros y podcasts.
  # ============================================================
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    user: "1000:1000"

    environment:
      <<: *common-env

    volumes:
      - ./data/audiobookshelf/config:/config
      - ./data/audiobookshelf/metadata:/metadata
      - ${MEDIA}/audiobooks:/audiobooks
      - ${MEDIA}/podcasts:/podcasts

    ports:
      - "${AUDIOBOOK_PORT}:80"

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging

  # ============================================================
  # Calibre-Web
  # ------------------------------------------------------------
  # Interfaz web para biblioteca Calibre.
  # ============================================================
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped

    environment:
      <<: *linuxserver-env

    volumes:
      - ./data/calibre-web:/config
      - ${MEDIA}/books/calibre:/books

    ports:
      - "${CALIBRE_PORT}:8083"

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging

  # ============================================================
  # Kavita
  # ------------------------------------------------------------
  # Servidor de lectura para comics, manga y libros.
  # ============================================================
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped

    environment:
      <<: *linuxserver-env

    volumes:
      - ./data/kavita:/config
      - ${MEDIA}:/data
    ports:
      - "${KAVITA_PORT}:5000"

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging

  # ============================================================
  # RomM
  # ------------------------------------------------------------
  # Gestor de biblioteca de ROMs.
  # ============================================================
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped

    depends_on:
      - romm-db

    environment:
      DB_HOST: ${ROMM_DB_HOST}
      DB_NAME: ${ROMM_DB_NAME}
      DB_USER: ${ROMM_DB_USER}
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_KEY}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      STREAMGRIDDB_API_KEY: ${SGDB_API_KEY}
      HASHEOUS_API_ENABLED: "true"

    volumes:
      - ./data/romm/resources:/romm/resources
      - ./data/romm/redis:/redis-data
      - ./data/romm/assets:/romm/assets
      - ./data/romm/config:/romm/config
      - ${MEDIA}/roms:/romm/library

    ports:
      - "${ROMM_PORT}:8080"

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging

  # ============================================================
  # RomM DB
  # ------------------------------------------------------------
  # Base de datos MariaDB para RomM.
  # ============================================================
  romm-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: romm-db
    restart: unless-stopped

    environment:
      <<: *linuxserver-env
      MYSQL_ROOT_PASSWORD: ${ROMM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ROMM_DB_NAME}
      MYSQL_USER: ${ROMM_DB_USER}
      MYSQL_PASSWORD: ${ROMM_DB_PASSWORD}

    volumes:
      - ./data/room/db:/config

    labels:
      <<: *common-labels

    logging:
      <<: *default-logging
