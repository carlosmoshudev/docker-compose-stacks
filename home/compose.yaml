# ============================================================
# STACK: Home [PRODUCCION]      compose.yaml
# ------------------------------------------------------------
# - ESPHome:        https://esphome.io/
# - Home Assistant: https://www.home-assistant.io/
# - Matter Server:  https://github.com/home-assistant-libs/python-matter-server
# - Mosquitto:      https://mosquitto.org/
# - Node-RED:       https://nodered.org/
# ------------------------------------------------------------
#   Desarrollado y mantenido por Carlos Moshu
#   Stack de cali-home, servidor domestico de Carlos y Lilia
# ============================================================

name: home

# ============================================================
# BLOQUES REUTILIZABLES
# ============================================================
x-common-env: &common-env
  TZ: ${TZ}

x-common-labels: &common-labels
  autoheal: "true"
  diun.enable: "true"

x-diun-labels: &diun-labels
  diun.enable: "true"

x-http-healthcheck: &http-healthcheck
  interval: 1m30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================
  # ESPHome
  # ------------------------------------------------------------
  # Gestion y compilacion de dispositivos ESPHome.
  # ============================================================
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped

    environment:
      <<: *common-env

    volumes:
      - ./data/esphome:/config
      - ${LOCALTIME}:${LOCALTIME}:ro

    ports:
      - "${ESPHOME_PORT}:6052"

    labels:
      <<: *common-labels

    healthcheck:
      <<: *http-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6052', timeout=5).read()"
        ]

    logging:
      <<: *default-logging

  # frigate:
  # go2rtc:
  # zwave-js-ui:

  # ============================================================
  # Home Assistant
  # ------------------------------------------------------------
  # Plataforma principal de automatizacion del hogar.
  # ============================================================
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    restart: unless-stopped

    environment:
      <<: *common-env

    volumes:
      - ./data/homeassistant:/config
      - ${LOCALTIME}:${LOCALTIME}:ro
      - ${DBUS}:${DBUS}:ro

    labels:
      <<: *common-labels

    healthcheck:
      <<: *http-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123', timeout=5).read()"
        ]

    logging:
      <<: *default-logging

  # ============================================================
  # Matter Server
  # ------------------------------------------------------------
  # Backend Matter usado por Home Assistant.
  # ============================================================
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host

    security_opt:
      - apparmor:unconfined

    volumes:
      - ./data/matter-server:/data
      - ${DBUS}:${DBUS}:ro

    command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0

    labels:
      <<: *diun-labels

    logging:
      <<: *default-logging

  # ============================================================
  # Mosquitto
  # ------------------------------------------------------------
  # Broker MQTT para integraciones domesticas.
  # ============================================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped

    environment:
      <<: *common-env

    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log

    ports:
      - "${MQTT_PORT}:1883"

    labels:
      <<: *diun-labels

    logging:
      <<: *default-logging

  # ============================================================
  # Node-RED
  # ------------------------------------------------------------
  # Automatizaciones visuales e integraciones internas.
  # ============================================================
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped

    environment:
      <<: *common-env

    volumes:
      - ./data/nodered:/data

    ports:
      - "${NODERED_PORT}:1880"

    labels:
      <<: *common-labels

    healthcheck:
      <<: *http-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1880').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]

    logging:
      <<: *default-logging

